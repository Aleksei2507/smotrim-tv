name: Новые серии и ссылки

on:
  schedule:
    - cron: '17 */2 * * *' # Каждые два часа; GitHub может задержать запуск.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Подготовить проверки
        run: |
          python3 -m venv "$RUNNER_TEMP/catalog-python"
          "$RUNNER_TEMP/catalog-python/bin/python" -m pip install -r tools/catalog-requirements.txt
          echo "$RUNNER_TEMP/catalog-python/bin" >> "$GITHUB_PATH"
      - name: Проверить сохранность каталога
        run: python3 -m unittest discover -s tools -p 'test_*catalog.py'
      - name: Обновить все сериалы и шоу
        run: python3 -u tools/refresh_series_catalog.py
      - name: Проверить результат
        run: python3 tools/build_catalog.py --check
      - name: Опубликовать данные одним коммитом
        shell: bash
        run: |
          git add catalog/v1 catalog/curated/details.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: автоматически обновить серии и ссылки'
          git push origin HEAD:main
