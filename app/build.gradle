plugins { id 'com.android.application' }
android {
    namespace 'ru.smotrim.tv'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'ru.smotrim.tv'
        minSdk 28
        targetSdk 35
        versionCode = (project.findProperty('smotrimVersionCode') ?: '24').toInteger()
        versionName = (project.findProperty('smotrimVersionName') ?: '0.6.9')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            def propsFile = rootProject.file('.signing/release.properties')
            if (propsFile.exists()) {
                def props = new Properties(); propsFile.withInputStream { props.load(it) }
                storeFile rootProject.file('.signing/smotrim.jks')
                storePassword props['storePassword']; keyAlias 'smotrim'; keyPassword props['keyPassword']
            }
        }
    }
    buildTypes { release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'); signingConfig signingConfigs.release }; debug { signingConfig signingConfigs.release } }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/INDEX.LIST'] }; jniLibs { useLegacyPackaging true; keepDebugSymbols += '**/libtorrserver.so' } }
    testOptions { unitTests.returnDefaultValues = true }
    sourceSets { test.java.srcDir 'src/testShared/java'; androidTest.java.srcDir 'src/testShared/java' }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.withType(Test).configureEach {
    systemProperty 'smotrim.torrserver.log', rootProject.file('../.toolchain/torrserver-test.log').absolutePath
    systemProperty 'smotrim.torrserver', rootProject.file('../.toolchain/downloads/TorrServer-darwin-arm64').absolutePath
}
